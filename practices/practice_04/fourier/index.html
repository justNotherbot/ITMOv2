<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ряды Фурье</title>
    <meta name="description" content="Интуитивное объяснение рядов Фурье" />
    <script>
      // MathJax configuration must be defined before loading script
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: { skipHtmlTags: ['noscript', 'style', 'textarea', 'pre', 'code'] }
      };
      // helper to typeset dynamically added math later
      window.requestMathJaxTypeset = function () {
        if (window.MathJax && MathJax.typesetPromise) {
          return MathJax.typesetPromise();
        }
        return Promise.resolve();
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 2rem; line-height: 1.6; }
      header { max-width: 860px; margin: 0 auto 2rem; }
      main { max-width: 860px; margin: 0 auto; }
      .formula-demo { background:#f8f9fa; padding:1rem; border-radius:8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Ряды Фурье</h1>
      <nav>
        <a href="/">Главная</a> · <a href="/chebyshev/">Полиномы Чебышева</a> · <a href="/approximation/">Теория приближения</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Формулы</h2>
        <p>
          Inline формула: $f(x)=\sum_{n=1}^{\infty} a_n\cos(nx)+b_n\sin(nx)$ отображается внутри текста.
        </p>
        <div class="formula-demo" aria-label="Пример блочной формулы">
          $$S_N(x)=\sum_{n=1}^{N}\big(a_n\cos(nx)+b_n\sin(nx)\big)$$
        </div>
      </section>
    </main>
  </body>
  </html>
